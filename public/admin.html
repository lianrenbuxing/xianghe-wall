<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>祥和表白墙 · 管理后台</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;background:#f5f2f7;color:#23202b;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{width:min(900px,100%);margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:19px;margin:0 0 4px;}
  .sub{color:#8a8394;font-size:12.5px;margin-bottom:20px;}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 10px 26px rgba(160,120,150,.14);margin-bottom:16px;}
  input[type=password]{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid #eee3ec;
    font-size:14px;outline:none;margin-bottom:12px;
  }
  input[type=password]:focus{border-color:#ff5f8d;}
  button{
    border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;
    background:linear-gradient(120deg,#ff5f8d,#9b6cff);color:#fff;font-weight:600;
  }
  button.ghost{background:#f2edf5;color:#5a5266;font-weight:500;}
  button.ghost:hover{background:#eae2f0;}
  button.danger{background:#ffe8ee;color:#e03060;font-weight:600;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .post{border:1px solid #f1e8ef;border-radius:14px;padding:14px;margin-bottom:12px;}
  .post.hidden{opacity:.5;background:#faf7fb;}
  .post .head{display:flex;gap:8px;align-items:center;font-size:13px;color:#8a8394;margin-bottom:8px;flex-wrap:wrap;}
  .badge{background:#f2edf5;border-radius:20px;padding:2px 9px;font-size:11.5px;}
  .badge.dark{background:#ffe8ee;color:#e03060;}
  .text{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
  .thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;}
  .stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:#5a5266;}
  .stat b{color:#ff5f8d;font-size:16px;}
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
    background:rgba(35,30,40,.94);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  .hide{display:none !important;}
  .t-input{
    flex:1 1 130px;min-width:0;padding:9px 11px;border-radius:9px;
    border:1px solid #eee3ec;font-size:13.5px;outline:none;
  }
  .t-input:focus{border-color:#ff5f8d;}
  .t-item{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border:1px solid #f1e8ef;border-radius:12px;padding:10px 12px;margin-bottom:8px;
  }
  .t-item.hidden{opacity:.5;background:#faf7fb;}
  .t-item .t-name{font-weight:600;font-size:13.5px;}
  .t-item .t-note{color:#8a8394;font-size:12.5px;}
  .t-item .t-actions{margin-left:auto;display:flex;gap:6px;}
  .t-item button{padding:6px 11px;font-size:12.5px;border-radius:8px;}
  .t-upload{
    padding:7px 12px;border-radius:9px;border:1px dashed #eee3ec;color:#8a8394;
    font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .t-upload:hover{border-color:#ff5f8d;color:#ff5f8d;}
  .t-avatar-preview{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>祥和表白墙 · 管理后台</h1>
  <div class="sub">Designed &amp; Developed by 余念大王</div>

  <div class="card" id="loginCard">
    <div style="font-size:14px;margin-bottom:12px;">请输入管理员密码</div>
    <input type="password" id="pwd" placeholder="管理员密码" />
    <div class="row">
      <button id="loginBtn">登录</button>
      <button class="ghost" onclick="location.href='/'">返回表白墙</button>
    </div>
  </div>

  <div id="panel" class="hide">
    <div class="card">
      <div class="stat" id="statBox">加载中…</div>
      <div class="row" style="margin-top:14px;">
        <button class="ghost" id="refreshBtn">刷新列表</button>
        <button class="ghost" id="logoutBtn">退出登录</button>
        <span style="font-size:12.5px;color:#8a8394;">提示：隐藏 = 前端不可见但数据保留，删除 = 彻底移除（含图片）</span>
      </div>
    </div>
    <div id="list"></div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px;">💝 致谢名单</div>
      <div style="font-size:12.5px;color:#8a8394;margin-bottom:12px;">
        排序数字越大越靠前；隐藏 = 前台不显示但保留数据
      </div>
      <div class="row" style="margin-bottom:12px;">
        <input class="t-input" id="tName" maxlength="20" placeholder="名字（必填）" />
        <input class="t-input" id="tNote" maxlength="60" placeholder="贡献说明，如：设计与开发" />
        <input class="t-input" id="tLink" placeholder="链接（可空，https://…）" />
        <input class="t-input" id="tSort" type="number" value="0" style="flex:0 0 88px;" title="排序，越大越靠前" />
        <button id="tSave">添加</button>
        <button class="ghost hide" id="tCancel">取消编辑</button>
      </div>
      <div class="row" style="margin-bottom:12px;">
        <label class="t-upload" for="tAvatar">🖼 选择头像</label>
        <input type="file" id="tAvatar" accept="image/*" class="hide" />
        <img id="tAvatarPreview" class="t-avatar-preview hide" alt="" />
        <span id="tAvatarHint" class="t-note">未选择头像</span>
        <button class="ghost hide" id="tAvatarClear" type="button">移除头像</button>
      </div>
      <div id="tList" style="font-size:13px;color:#8a8394;">加载中…</div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('xh_admin_token') || '';

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function api(path, options = {}){
  const res = await fetch('/api' + path, {
    ...options,
    headers: { ...(options.headers||{}), Authorization: 'Bearer ' + token }
  });
  if (res.status === 401) { logout(); throw new Error('登录已过期，请重新登录'); }
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

async function login(){
  const password = $('pwd').value;
  if (!password) return toast('请输入密码');
  try{
    const res = await fetch('/api/admin/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登录失败');
    token = data.token;
    localStorage.setItem('xh_admin_token', token);
    $('pwd').value = '';
    enterPanel();
  }catch(e){ toast(e.message); }
}

function logout(){
  token = '';
  localStorage.removeItem('xh_admin_token');
  $('panel').classList.add('hide');
  $('loginCard').classList.remove('hide');
}

async function enterPanel(){
  $('loginCard').classList.add('hide');
  $('panel').classList.remove('hide');
  await Promise.all([loadStats(), loadList(), loadThanks()]);
}

async function loadStats(){
  try{
    const s = await (await fetch('/api/stats')).json();
    const all = await api('/admin/posts');
    const hidden = all.posts.filter(p => p.hidden).length;
    $('statBox').innerHTML =
      `<div>💌 公开表白 <b>${s.posts}</b> 条</div>` +
      `<div>🙈 已隐藏 <b>${hidden}</b> 条</div>` +
      
      `<div>❤ 总赞数 <b>${s.likes}</b></div>` +
      `<div>💬 总评论 <b>${s.comments}</b></div>`;
  }catch(e){ $('statBox').textContent = '统计加载失败'; }
}

async function loadList(){
  $('list').innerHTML = '<div class="card">加载中…</div>';
  try{
    const { posts } = await api('/admin/posts');
    if (!posts.length){
      $('list').innerHTML = '<div class="card">还没有任何内容</div>';
      return;
    }
    $('list').innerHTML = '<div class="card">' + posts.map(p => `
      <div class="post ${p.hidden ? 'hidden' : ''}" data-id="${p.id}">
        <div class="head">
          <b style="color:#23202b">${esc(p.name)}</b>
          <span class="badge">#${esc(p.tag)}</span>
          <span class="badge">❤ ${p.likes}</span>
          <span class="badge">💬 ${p.comment_count}</span>
          <span>${fmt(p.created_at)}</span>
          ${p.hidden ? '<span class="badge dark">已隐藏</span>' : ''}
          ${p.pinned ? '<span class="badge" style="background:#fff3d6;color:#b8860b">📌 置顶</span>' : ''}
        </div>
        <div class="text">${esc(p.text)}</div>
        ${p.images.length ? `<div class="thumbs">${p.images.map(src=>`<img src="${esc(src)}" alt="" loading="lazy" />`).join('')}</div>` : ''}
        <div class="row" style="margin-top:12px;">
          <button class="ghost" data-act="hide">${p.hidden ? '取消隐藏' : '隐藏'}</button>
          <button class="ghost" data-act="pin">${p.pinned ? '取消置顶' : '置顶'}</button>
          <button class="danger" data-act="del">删除</button>
        </div>
      </div>
    `).join('') + '</div>';
  }catch(e){
    $('list').innerHTML = '<div class="card">' + esc(e.message) + '</div>';
  }
}

// ---------- 致谢名单 ----------
let thanksCache = [];
let editingThanksId = null;
let pendingAvatar = null;
let removeAvatarFlag = false;
let avatarObjectUrl = '';

function setAvatarPreview(url, hint){
  const img = $('tAvatarPreview');
  if (url){
    img.src = url;
    img.classList.remove('hide');
  } else {
    img.removeAttribute('src');
    img.classList.add('hide');
  }
  $('tAvatarHint').textContent = hint || (url ? '已选择头像' : '未选择头像');
  $('tAvatarClear').classList.toggle('hide', !url);
}

async function loadThanks(){
  try{
    const { thanks } = await api('/admin/thanks');
    thanksCache = thanks;
    if (!thanks.length){
      $('tList').innerHTML = '还没有条目，上面填一个试试～';
      return;
    }
    $('tList').innerHTML = thanks.map(t => `
      <div class="t-item ${t.hidden ? 'hidden' : ''}" data-id="${t.id}">
        ${t.avatar ? `<img class="t-avatar-preview" src="${esc(t.avatar)}" alt="" />` : ''}
        <span class="t-name">${esc(t.name)}</span>
        ${t.note ? `<span class="t-note">${esc(t.note)}</span>` : ''}
        ${t.link ? `<a class="t-note" href="${esc(t.link)}" target="_blank" rel="noopener noreferrer">🔗 链接</a>` : ''}
        <span class="t-note">排序 ${t.sort}</span>
        ${t.hidden ? '<span class="badge dark">已隐藏</span>' : ''}
        <span class="t-actions">
          <button class="ghost" data-tact="edit">编辑</button>
          <button class="ghost" data-tact="hide">${t.hidden ? '显示' : '隐藏'}</button>
          <button class="danger" data-tact="del">删除</button>
        </span>
      </div>
    `).join('');
  }catch(e){
    $('tList').textContent = e.message;
  }
}

function resetThanksForm(){
  editingThanksId = null;
  pendingAvatar = null;
  removeAvatarFlag = false;
  if (avatarObjectUrl){ URL.revokeObjectURL(avatarObjectUrl); avatarObjectUrl = ''; }
  $('tName').value = '';
  $('tNote').value = '';
  $('tLink').value = '';
  $('tSort').value = '0';
  $('tSave').textContent = '添加';
  $('tCancel').classList.add('hide');
  setAvatarPreview('', '未选择头像');
}

async function saveThanks(){
  const name = $('tName').value.trim();
  if (!name) return toast('名字不能为空');

  const fd = new FormData();
  fd.append('name', name);
  fd.append('note', $('tNote').value.trim());
  fd.append('link', $('tLink').value.trim());
  fd.append('sort', String(Number($('tSort').value) || 0));
  if (pendingAvatar) fd.append('avatar', pendingAvatar);
  if (removeAvatarFlag) fd.append('removeAvatar', '1');

  const isEdit = editingThanksId !== null;
  try{
    if (isEdit){
      await api('/admin/thanks/' + editingThanksId, { method: 'PUT', body: fd });
    } else {
      await api('/admin/thanks', { method: 'POST', body: fd });
    }
    resetThanksForm();
    await loadThanks();
    toast(isEdit ? '已保存' : '已添加');
  }catch(e){ toast(e.message); }
}

$('tSave').addEventListener('click', saveThanks);
$('tCancel').addEventListener('click', resetThanksForm);
['tName', 'tNote', 'tLink', 'tSort'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') saveThanks(); });
});

$('tAvatar').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('只能选图片文件');
  if (file.size > 5 * 1024 * 1024) return toast('头像不能超过 5MB');

  if (avatarObjectUrl) URL.revokeObjectURL(avatarObjectUrl);
  avatarObjectUrl = URL.createObjectURL(file);
  pendingAvatar = file;
  removeAvatarFlag = false;
  setAvatarPreview(avatarObjectUrl, '已选择：' + file.name);
});

$('tAvatarClear').addEventListener('click', () => {
  pendingAvatar = null;
  removeAvatarFlag = true;
  if (avatarObjectUrl){ URL.revokeObjectURL(avatarObjectUrl); avatarObjectUrl = ''; }
  setAvatarPreview('', '保存后移除头像');
  $('tAvatarClear').classList.add('hide');
});

$('tList').addEventListener('click', async e => {
  const btn = e.target.closest('[data-tact]');
  if (!btn) return;
  const item = btn.closest('.t-item');
  const id = item.dataset.id;
  const act = btn.dataset.tact;

  try{
    if (act === 'del'){
      if (!confirm('确定删除这条致谢吗？')) return;
      await api('/admin/thanks/' + id, { method: 'DELETE' });
      toast('已删除');
    } else if (act === 'hide'){
      const { hidden } = await api('/admin/thanks/' + id + '/hide', { method: 'POST' });
      toast(hidden ? '已隐藏' : '已显示');
    } else if (act === 'edit'){
      const t = thanksCache.find(x => String(x.id) === id);
      if (!t) return;
      editingThanksId = id;
      pendingAvatar = null;
      removeAvatarFlag = false;
      if (avatarObjectUrl){ URL.revokeObjectURL(avatarObjectUrl); avatarObjectUrl = ''; }
      $('tName').value = t.name;
      $('tNote').value = t.note;
      $('tLink').value = t.link;
      $('tSort').value = String(t.sort);
      $('tSave').textContent = '保存修改';
      $('tCancel').classList.remove('hide');
      setAvatarPreview(t.avatar || '', t.avatar ? '当前头像' : '未选择头像');
      $('tName').focus();
      return;
    }
    await loadThanks();
  }catch(err){ toast(err.message); }
});

$('loginBtn').addEventListener('click', login);
$('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });$('logoutBtn').addEventListener('click', logout);
$('refreshBtn').addEventListener('click', enterPanel);

$('list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.post');
  const id = card.dataset.id;

  if (btn.dataset.act === 'del'){
    if (!confirm('确定彻底删除这条内容吗？图片文件也会一并删除，无法恢复。')) return;
    try{
      await api('/admin/posts/' + id, { method: 'DELETE' });
      toast('已删除');
      enterPanel();
    }catch(err){ toast(err.message); }
  }
     if (btn.dataset.act === 'pin'){
    try{
      const { pinned } = await api('/admin/posts/' + id + '/pin', { method: 'POST' });
      toast(pinned ? '已置顶' : '已取消置顶');
      enterPanel();
    }catch(err){ toast(err.message); }
  }
  if (btn.dataset.act === 'hide'){
    try{
      const { hidden } = await api('/admin/posts/' + id + '/hide', { method: 'POST' });
      toast(hidden ? '已隐藏' : '已恢复显示');
      enterPanel();
    }catch(err){ toast(err.message); }
  }
});

if (token) enterPanel(); else $('loginCard').classList.remove('hide');
</script>
</body>
</html>
